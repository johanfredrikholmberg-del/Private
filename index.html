<title>StudieLots – öppnar snart</title>
<style>
:root{--deep:#003f36;--deep2:#005446;--deep3:#006150;--mint:#76cfac;--mint2:#b9dfce;--cream:#fbf5e9;--soft:#c7ded5}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--deep);color:var(--cream)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.page{position:relative;min-height:100svh;overflow:hidden;background:radial-gradient(circle at 111% 4%,rgba(124,205,175,.14) 0 25%,transparent 25.3%),radial-gradient(circle at -18% 47%,rgba(124,205,175,.10) 0 31%,transparent 31.3%),linear-gradient(180deg,#00483c 0%,#006050 55%,#00483d 100%)}
.page:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.015) 48%,transparent 72%)}
.wrap{position:relative;z-index:1;width:min(430px,100%);min-height:100svh;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin:1px 0 21px}.brand-logo{width:94px;height:86px;flex:none;overflow:visible}.brand-copy{text-align:left}.brand-name{font-size:34px;font-weight:900;line-height:.95;letter-spacing:-.055em;white-space:nowrap}.brand-name span{color:var(--mint)}.brand-sub{margin-top:8px;font-size:14px;color:var(--soft);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 17px;border:1.5px solid rgba(111,213,175,.63);border-radius:22px;background:rgba(0,54,46,.18);font-size:15px;font-weight:800}.badge i{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px rgba(118,207,172,.5)}
h1{max-width:390px;margin:27px auto 15px;font-size:49px;line-height:.98;letter-spacing:-.06em;font-weight:900;text-wrap:balance}.lead{max-width:345px;margin:0;color:#cde0d8;font-size:17px;line-height:1.46;letter-spacing:-.01em}
.steps{width:100%;display:grid;grid-template-columns:1fr 20px 1fr 20px 1fr;align-items:start;gap:0;margin-top:31px}.step{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12.5px;font-weight:820;line-height:1.12}.circle{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(118,207,172,.48);background:rgba(255,255,255,.015)}.circle svg{width:35px;height:35px;fill:none;stroke:#fbf5e9;stroke-width:2.65;stroke-linecap:round;stroke-linejoin:round}.arrow{align-self:center;margin-top:24px;color:var(--mint);font-size:24px;font-weight:500}
.seascape{position:relative;width:calc(100% + 36px);height:196px;margin-top:18px;overflow:hidden}.seascape svg{width:100%;height:100%;display:block}.launch{margin-top:-4px;font-size:12px;color:rgba(199,222,213,.72)}
@media(min-width:700px){.wrap{width:min(760px,100%);padding-top:34px}.brand-logo{width:108px;height:98px}.brand-name{font-size:40px}.brand-sub{font-size:16px}.badge{height:48px;border-radius:24px;font-size:16px}h1{max-width:690px;font-size:72px;margin-top:34px}.lead{max-width:520px;font-size:21px}.steps{margin-top:40px;grid-template-columns:1fr 36px 1fr 36px 1fr}.circle{width:92px;height:92px}.circle svg{width:44px;height:44px}.step{font-size:14px}.arrow{margin-top:31px;font-size:30px}.seascape{width:calc(100% + 44px);height:270px;margin-top:26px}.launch{font-size:14px}}
@media(max-height:720px) and (max-width:560px){.wrap{padding-top:calc(12px + env(safe-area-inset-top))}.brand{margin-bottom:15px}.brand-logo{width:80px;height:74px}.brand-name{font-size:30px}.brand-sub{font-size:12px}.badge{height:40px;font-size:13px}h1{font-size:43px;margin-top:20px}.lead{font-size:15.5px}.steps{margin-top:24px}.circle{width:64px;height:64px}.circle svg{width:31px;height:31px}.step{font-size:11.5px}.arrow{margin-top:21px}.seascape{height:170px;margin-top:10px}}
</style>
</head>
