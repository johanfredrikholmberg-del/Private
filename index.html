<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="description" content="StudieLots hjälper dig hitta kortaste vägen till din examen utifrån det du redan har läst." />
<title>StudieLots – öppnar snart</title>
<style>
:root{--bg:#075447;--bg2:#063f36;--mint:#9bd6bf;--cream:#f7f3e9;--muted:#b8d8cd}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg2);color:var(--cream)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(circle at 105% 8%,rgba(113,194,165,.14) 0 22%,transparent 22.2%),linear-gradient(155deg,#063f36,#086050 58%,#06483e);overflow-x:hidden}
main{min-height:100svh;position:relative;display:flex;justify-content:center;padding:calc(34px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow:hidden}
main:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;left:-270px;bottom:80px;background:rgba(151,211,188,.06)}
.hero{position:relative;z-index:1;width:min(720px,100%);text-align:center;display:flex;flex-direction:column;align-items:center}
.brand{display:flex;align-items:center;justify-content:center;gap:15px;margin:8px 0 28px;color:var(--cream)}
.mark{width:72px;height:72px;border:3px solid var(--cream);border-radius:50%;position:relative;flex:0 0 auto;overflow:hidden}
.mark:before{content:"";position:absolute;left:27px;top:14px;width:17px;height:31px;background:var(--cream);clip-path:polygon(30% 0,70% 0,70% 18%,100% 28%,84% 38%,84% 100%,16% 100%,16% 38%,0 28%,30% 18%)}
.mark:after{content:"≈";position:absolute;left:8px;right:8px;bottom:-3px;font-size:38px;font-weight:800;line-height:1;color:var(--bg)}
.brandtext{text-align:left}.brandname{font-size:32px;font-weight:850;letter-spacing:-.04em;line-height:1}.brandname span{color:var(--mint)}.tagline{margin-top:7px;color:var(--muted);font-size:15px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid rgba(247,243,233,.22);border-radius:999px;background:rgba(255,255,255,.04);font-size:14px;font-weight:800;color:var(--cream)}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:#70c9a8}
h1{max-width:680px;margin:30px auto 18px;font-size:clamp(45px,8vw,72px);line-height:.98;letter-spacing:-.055em;font-weight:880;color:var(--cream)}
.lead{max-width:520px;margin:0;color:var(--muted);font-size:20px;line-height:1.45}
.flow{width:100%;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:start;gap:10px;margin-top:42px}.item{display:flex;flex-direction:column;align-items:center;gap:11px;font-size:14px;font-weight:800;line-height:1.2}.icon{width:82px;height:82px;border:1.5px solid rgba(155,214,191,.35);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.025);font-size:31px;color:var(--mint)}.arrow{align-self:center;margin-top:28px;color:var(--mint);font-size:25px}
.sea{position:relative;width:calc(100% + 44px);height:120px;margin-top:auto;min-height:120px;overflow:hidden}.sea:before,.sea:after{content:"";position:absolute;left:-10%;width:120%;height:75px;border-radius:50% 50% 0 0/35% 35% 0 0}.sea:before{bottom:-32px;background:#0b6958;transform:rotate(-2deg)}.sea:after{bottom:-50px;background:#075043;transform:rotate(2deg)}
.boat{position:absolute;z-index:2;left:58%;bottom:22px;width:94px;height:32px;border:3px solid var(--cream);border-top:0;border-radius:3px 3px 28px 12px;transform:skewX(-8deg)}.boat:before{content:"";position:absolute;width:45px;height:23px;left:19px;top:-22px;border:3px solid var(--cream);border-bottom:0}.boat:after{content:"⚑";position:absolute;left:42px;top:-48px;font-size:25px;color:var(--cream);transform:skewX(8deg)}
footer{margin-top:8px;color:rgba(184,216,205,.72);font-size:13px;padding-bottom:5px}
@media(max-width:560px){main{padding-top:calc(28px + env(safe-area-inset-top))}.brand{margin-bottom:24px;gap:12px}.mark{width:62px;height:62px}.mark:before{left:23px;top:12px;width:15px;height:27px}.mark:after{font-size:33px;left:7px}.brandname{font-size:28px}.tagline{font-size:13px}.eyebrow{font-size:13px}h1{font-size:47px;max-width:390px;margin-top:27px}.lead{font-size:17px;max-width:340px}.flow{margin-top:36px;gap:4px}.icon{width:66px;height:66px;font-size:25px}.item{font-size:12px}.arrow{font-size:20px;margin-top:23px}.sea{height:105px;min-height:105px;margin-top:32px}.boat{transform:scale(.82) skewX(-8deg);transform-origin:bottom center}footer{font-size:12px}}
</style>
</head>
<body><main><section class="hero">
<div class="brand" aria-label="StudieLots – Digital studievägledare"><div class="mark" aria-hidden="true"></div><div class="brandtext"><div class="brandname">Studie<span>Lots</span></div><div class="tagline">Digital studievägledare</div></div></div>
<div class="eyebrow">Öppnar snart</div>
<h1>Hitta kortaste vägen till din examen.</h1>
<p class="lead">Se hur det du redan har läst kan ta dig vidare.</p>
<div class="flow" aria-label="Så fungerar StudieLots"><div class="item"><div class="icon">▤</div><span>Importera<br>meriter</span></div><div class="arrow">›</div><div class="item"><div class="icon">⌕</div><span>Se<br>möjligheter</span></div><div class="arrow">›</div><div class="item"><div class="icon">⌖</div><span>Planera<br>vägen</span></div></div>
<div class="sea" aria-hidden="true"><div class="boat"></div></div><footer>StudieLots · Lanseras snart</footer>
</section></main></body></html>
