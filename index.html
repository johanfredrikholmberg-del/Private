<!doctype html>

<title>StudieLots – öppnar snart</title>
<link rel="stylesheet" href="/studielots-v615.css?v=615">
<style>
:root{color-scheme:light;--green:#124d40;--green-2:#176b5b;--mint:#dff1e8;--cream:#f7f4ec;--white:#fff;--soft:rgba(255,255,255,.72)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--green)}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;color:var(--white);overflow-x:hidden}
body:before{content:"";position:fixed;width:520px;height:520px;border-radius:50%;right:-260px;top:-210px;background:rgba(223,241,232,.09);pointer-events:none}body:after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;left:-250px;bottom:-260px;background:rgba(255,255,255,.05);pointer-events:none}
main{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom))}
.hero{width:min(760px,100%);text-align:center}.logo-wrap{display:inline-flex;align-items:center;justify-content:center;background:var(--cream);border-radius:22px;padding:8px 17px;margin-bottom:40px;box-shadow:0 16px 45px rgba(0,0,0,.10)}.app-logo.studielots-visual-header-image{width:230px!important;height:64px!important;margin:0!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important}
.eyebrow{display:inline-flex!important;align-items:center!important;gap:8px!important;background:rgba(223,241,232,.13)!important;border:1px solid rgba(223,241,232,.18)!important;color:#dff1e8!important;border-radius:999px!important;padding:9px 13px!important;margin:0 0 20px!important;font-size:13px!important;font-weight:800!important;letter-spacing:.02em!important;text-transform:none!important}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:#7fc5a5}
h1{font-size:clamp(42px,8vw,72px)!important;line-height:.98!important;letter-spacing:-.055em!important;margin:0 auto 20px!important;max-width:700px!important;color:#fff!important;font-weight:850!important}p{font-size:clamp(18px,2.3vw,22px)!important;line-height:1.5!important;color:rgba(255,255,255,.76)!important;max-width:560px!important;margin:0 auto!important}.flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:34px auto 0}.step{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:11px 15px;font-size:14px;font-weight:750;color:#fff}.arrow{color:#8fc8b2;font-size:20px;line-height:1}footer{margin-top:34px;color:rgba(255,255,255,.50);font-size:13px}
@media(max-width:560px){main{align-items:flex-start;padding-top:calc(42px + env(safe-area-inset-top))}.logo-wrap{margin-bottom:34px;border-radius:18px;padding:6px 13px}.app-logo.studielots-visual-header-image{width:205px!important;height:58px!important}.eyebrow{margin-bottom:18px!important}h1{font-size:46px!important;max-width:390px!important}p{font-size:17px!important;max-width:350px!important}.flow{margin-top:30px;gap:8px}.step{padding:10px 13px;font-size:13px}.arrow{font-size:17px}footer{margin-top:28px}}
</style>

<body>
<main>
  <section class="hero">
    <div class="logo-wrap"><div class="app-logo studielots-visual-header-image" role="img" aria-label="StudieLots"></div></div>
    <div><span class="eyebrow">Öppnar snart</span></div>
    <h1>Hitta kortaste vägen till din examen.</h1>
    <p>Se hur det du redan har läst kan ta dig vidare.</p>
    <div class="flow" aria-label="Så fungerar StudieLots">
      <span class="step">Importera meriter</span><span class="arrow">›</span>
      <span class="step">Se möjligheter</span><span class="arrow">›</span>
      <span class="step">Planera vägen</span>
    </div>
    <footer>StudieLots · Lanseras snart</footer>
  </section>
</main>

</html>
