<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<meta name="description" content="StudieLots hjälper dig hitta smartaste vägen genom dina tidigare studier mot nästa examen." />
<title>StudieLots – snart lansering</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#667085;--blue:#265ee8;--line:rgba(23,32,51,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% -10%,rgba(38,94,232,.14),transparent 32rem),#f7f9fc}
main{min-height:100vh;display:grid;place-items:center;padding:32px 20px}.wrap{width:min(760px,100%);text-align:center}.mark{width:76px;height:76px;margin:0 auto 22px;border-radius:24px;background:#fff;box-shadow:0 18px 55px rgba(23,32,51,.10);display:grid;place-items:center}.mark svg{width:48px;height:48px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.brand{font-size:clamp(18px,2vw,22px);font-weight:800;letter-spacing:-.02em;margin-bottom:20px}.eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);background:rgba(38,94,232,.08);padding:8px 12px;border-radius:999px;margin-bottom:18px}h1{font-size:clamp(42px,8vw,72px);line-height:.98;letter-spacing:-.055em;margin:0 auto 22px;max-width:720px}p{font-size:clamp(17px,2.5vw,21px);line-height:1.55;color:var(--muted);max-width:620px;margin:0 auto}.points{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:34px auto 0}.points span{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:0 8px 30px rgba(23,32,51,.04)}footer{margin-top:48px;color:#98a2b3;font-size:13px}@media(max-width:520px){main{padding:28px 18px}.mark{width:68px;height:68px;border-radius:21px}h1{font-size:44px}.points{gap:8px}.points span{font-size:13px;padding:9px 12px}}
</style>
</head>
<body>
<main><div class="wrap">
<div class="mark" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M12 39h40l-6 11H20z"/><path d="M24 39V24h18v15"/><path d="M28 24v-8h9v8"/><path d="M37 16V9"/><path d="M37 9l10 5-10 4"/><path d="M8 54c7-4 12 4 19 0s12 4 19 0 8 1 10 0"/></svg></div>
<div class="brand">StudieLots</div>
<div class="eyebrow">På väg</div>
<h1>Hitta smartaste vägen till din examen.</h1>
<p>StudieLots hjälper dig att förstå hur dina tidigare studier kan användas och vilka vägar som kan ta dig vidare. Vi bygger just nu tjänsten inför lansering.</p>
<div class="points"><span>Dina meriter</span><span>Dina möjligheter</span><span>Din väg framåt</span></div>
<footer>StudieLots · Lanseras snart</footer>
</div></main>
</body>
</html>
