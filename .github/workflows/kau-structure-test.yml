name: Karlstad structure test

on:
  push:
    branches: [kau-structure-test]
    paths:
      - '.github/workflows/kau-structure-test.yml'
      - 'scripts/kau-programme-structure-pipeline.mjs'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kau-structure-test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enrich all Karlstad programme structures
        env:
          KAU_STRUCTURE_CONCURRENCY: '16'
        run: node scripts/kau-programme-structure-pipeline.mjs
      - name: Validate structure parse
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('data/kau/structure-meta.json','utf8'));
          if(m.officialProgrammes!==134||m.processed!==134) throw new Error('Not all KAU programmes processed');
          if(!m.withParsedRows) throw new Error('Parser produced zero programme rows');
          console.log(JSON.stringify(m,null,2));
          NODE
      - name: Commit structure result
        run: |
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/kau/structure-meta.json data/susa/structures.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Karlstad programme structures [skip ci]'
          git push origin HEAD:kau-structure-test
