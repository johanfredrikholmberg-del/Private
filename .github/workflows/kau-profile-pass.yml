name: Karlstad profile-aware pass
on:
  push:
    branches: [kau-fast-import]
    paths: ['.github/workflows/kau-profile-pass.yml']
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kau-fast-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade profile-based programme structures
        run: node scripts/kau-profile-structure-pass.mjs
      - name: Validate Karlstad dataset
        run: node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('data/kau/structures.json','utf8'));const m=JSON.parse(fs.readFileSync('data/kau/structure-meta.json','utf8'));if(r.length!==134||m.profilePassFetchErrors)process.exit(1);console.log(m)"
      - name: Save profile-aware structures
        run: |
          git config user.name studielots-bot
          git config user.email actions@users.noreply.github.com
          git add -f data/kau data/susa/structures.json
          git diff --cached --quiet || git commit -m 'Improve Karlstad profile-aware programme structures [skip ci]'
          git pull --rebase origin kau-fast-import
          git push origin HEAD:kau-fast-import
