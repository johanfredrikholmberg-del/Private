name: GU course offering import

on:
  workflow_dispatch:
  push:
    branches: [gu-program-import]
    paths:
      - 'scripts/gu-course-offerings-pipeline.mjs'
      - '.github/workflows/gu-course-offerings.yml'
      - 'data/gu/manual-course-complement-2026-09-15.csv'

permissions:
  contents: write

concurrency:
  group: gu-course-offering-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gu-program-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import GU course offerings and dates
        env:
          GU_OFFERING_CONCURRENCY: '10'
          GU_OFFERING_LIMIT: '3000'
        run: node scripts/gu-course-offerings-pipeline.mjs
      - name: Validate GU offering output and prevent data loss
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const meta=JSON.parse(fs.readFileSync('data/gu/course-offerings-meta.json','utf8'));
          const rows=JSON.parse(fs.readFileSync('data/HT26/course-offerings.json','utf8'));
          const previous=JSON.parse(cp.execFileSync('git',['show','HEAD:data/HT26/course-offerings.json'],{encoding:'utf8',maxBuffer:100*1024*1024}));
          if(meta.database!=='StudieLots HT26') throw new Error('Wrong target database');
          if(!Array.isArray(rows)) throw new Error('course-offerings.json missing');
          const isGU=x=>String(x.university||'').toLocaleLowerCase('sv-SE')==='göteborgs universitet';
          const guRows=rows.filter(isGU);
          if(meta.offeringRows!==guRows.length) throw new Error('Offering row count mismatch');
          const key=x=>String(x.key||'');
          if(new Set(rows.map(key)).size!==rows.length) throw new Error('Duplicate offering keys');
          const usable=x=>Boolean(x.startDate&&x.endDate&&x.sourceUrl&&x.standaloneSearchable===true&&x.applicationStatus!=='cancelled');
          const retained=new Set(guRows.filter(usable).map(x=>String(x.courseCode||'').toUpperCase()));
          const missing=[...new Set(previous.filter(isGU).filter(usable).map(x=>String(x.courseCode||'').toUpperCase()))].filter(code=>!retained.has(code));
          if(missing.length) throw new Error('Existing usable GU courses lost: '+missing.slice(0,30).join(', '));
          const otherBefore=previous.filter(x=>!isGU(x)).map(key).sort();
          const otherAfter=rows.filter(x=>!isGU(x)).map(key).sort();
          if(JSON.stringify(otherBefore)!==JSON.stringify(otherAfter)) throw new Error('Other universities changed');
          if(meta.processedThisRun < meta.remaining && meta.processedThisRun < 2000) throw new Error('GU import stopped before full unresolved sweep');
          console.log({totalRows:rows.length,guRows:guRows.length,previousUsableGU:previous.filter(isGU).filter(usable).length,currentUsableGU:guRows.filter(usable).length});
          NODE
      - name: Commit GU course offering progress
        run: |
          if [ -z "$(git status --porcelain -- data/HT26/course-offerings.json data/HT26/manifest.json data/gu/course-offerings-meta.json)" ]; then exit 0; fi
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/HT26/course-offerings.json data/HT26/manifest.json data/gu/course-offerings-meta.json
          git commit -m 'Import GU course offerings into StudieLots HT26 [skip ci]'
          git fetch origin gu-program-import
          git rebase origin/gu-program-import
          git push origin HEAD:gu-program-import
