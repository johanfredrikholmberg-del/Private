name: Beta regression tests

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ladok fixture
        run: node scripts/ladok-regression-test.mjs
      - name: Current API and engine tests
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Planner course dates
        run: node tests/planner-course-dates.cjs
      - name: Historical evidence view
        run: node tests/evidence-view.cjs
      - name: Credit ledger regression
        run: node tests/credit-ledger-regression.cjs
      - name: Subject programme score regression
        run: node tests/subject-program-score-regression.cjs
      - name: Credit transfer rules
        run: node scripts/test-credit-transfer.mjs
      - name: Degree rules and programme matching
        run: |
          node scripts/v2-degree-rules-regression-test.mjs
          node scripts/v2-credit-match-regression-test.mjs
      - name: Canonical runtime and module boundaries
        run: |
          node scripts/v2-runtime-source-guard.mjs
          node scripts/v2-module-boundaries-test.mjs
