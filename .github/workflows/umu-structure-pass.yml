name: Umea structure pass
on:
  push:
    branches: [umu-program-import]
    paths:
      - 'scripts/umu-structure-pass.mjs'
      - '.github/workflows/umu-structure-pass.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: umu-program-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse official Umea programme layouts
        run: node scripts/umu-structure-pass.mjs
      - name: Validate structures
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('data/umu/meta.json'));const s=JSON.parse(fs.readFileSync('data/umu/structures.json'));if(s.length!==m.programmes||m.temporaryErrors)process.exit(1);console.log(m.counts)"
      - name: Save structures
        run: |
          git config user.name studielots-bot
          git config user.email actions@users.noreply.github.com
          git add -f data/umu
          git diff --cached --quiet || git commit -m 'Parse Umea official programme structures [skip ci]'
          git pull --rebase origin umu-program-import
          git push origin HEAD:umu-program-import
