name: Karlstad education-plan fallback
on:
  push:
    branches: [kau-fast-import]
    paths: ['.github/workflows/kau-plan-fallback.yml']
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kau-fast-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check PDF text support
        run: command -v pdftotext
      - name: Upgrade from official KAU education plans
        run: node scripts/kau-education-plan-fallback.mjs
      - name: Validate Karlstad dataset
        run: node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('data/kau/structures.json','utf8'));const m=JSON.parse(fs.readFileSync('data/kau/structure-meta.json','utf8'));if(r.length!==134)process.exit(1);console.log(m)"
      - name: Save education-plan upgrades
        run: |
          git config user.name studielots-bot
          git config user.email actions@users.noreply.github.com
          git add -f data/kau data/susa/structures.json
          git diff --cached --quiet || git commit -m 'Improve Karlstad structures from official education plans [skip ci]'
          git pull --rebase origin kau-fast-import
          git push origin HEAD:kau-fast-import
