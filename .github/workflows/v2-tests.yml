name: StudieLots v2 regression tests
on:
  push:
    branches: [studielots-v2]
  pull_request:
    branches: [studielots-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Existing Ladok fixture
        run: node scripts/ladok-regression-test.mjs
      - name: V2 degree engine
        run: node scripts/v2-engine-regression-test.mjs
      - name: V2 Ladok parser
        run: node scripts/v2-ladok-parser-test.mjs
      - name: V2 local degree rules
        run: node scripts/v2-degree-rules-regression-test.mjs
      - name: V2 credit matching
        run: node scripts/v2-credit-match-regression-test.mjs
      - name: V2 fast route
        run: node scripts/v2-fast-route-regression-test.mjs
      - name: Ordinary study path remainder batch 1
        continue-on-error: true
        env:
          STUDIELOTS_BASE_URL: https://studielots-git-studi-5f5a74-johanfredrikholmberg-6513s-projects.vercel.app
        run: node scripts/audit-program-coverage.mjs --offset 0 --limit 50 --concurrency 1 --timeout 30000
