name: Uppsala sequential HT26 study-plan evidence
on:
  push:
    branches: [gu-program-import]
    paths:
      - '.github/workflows/uppsala-sequential-studyplans.yml'
      - 'scripts/uppsala-sequential-studyplans.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uppsala-sequential-studyplans
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gu-program-import
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Fetch Uppsala study plans one at a time
        run: python scripts/uppsala-sequential-studyplans.py
      - name: Validate and persist isolated staging evidence
        if: always()
        run: |
          if [ ! -f data/uppsala/ht26-sequential-studyplan-evidence.json ]; then exit 1; fi
          python - <<'PY'
          import json
          p=json.load(open('data/uppsala/ht26-sequential-studyplan-evidence.json'))
          assert p['canonicalDatabaseWritten'] is False and p['liveDatabaseWritten'] is False
          assert p['totalCourseRows']==sum(x['courseRows'] for x in p['programmes'])
          assert all(x['sourceUrl'].startswith('https://www.uu.se/utbildning/studieplan?') for x in p['programmes'])
          print('Uppsala programmes',len(p['programmes']),'course rows',p['totalCourseRows'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/uppsala/ht26-sequential-studyplan-evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: preserve Uppsala study-plan evidence [skip ci]'
          git pull --rebase origin gu-program-import
          git push origin HEAD:gu-program-import
