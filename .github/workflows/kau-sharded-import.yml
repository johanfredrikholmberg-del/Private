name: Karlstad sharded import

on:
  push:
    branches: [kau-sharded-import]
    paths:
      - '.github/workflows/kau-sharded-import.yml'
      - 'scripts/kau-programme-structure-pipeline.mjs'
      - 'scripts/kau-merge-shards.mjs'
      - 'scripts/kau-finalize-overrides.mjs'
      - 'scripts/kau-unresolved-report.mjs'

permissions:
  contents: write

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kau-sharded-import
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import Karlstad shard
        env:
          KAU_SHARD_TOTAL: '8'
          KAU_SHARD_INDEX: ${{ matrix.shard }}
          KAU_STRUCTURE_CONCURRENCY: '2'
          KAU_STRUCTURE_RETRIES: '2'
        run: node scripts/kau-programme-structure-pipeline.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: kau-shard-${{ matrix.shard }}
          path: data/kau/shard-${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kau-sharded-import
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: kau-shard-*
          path: data/kau
          merge-multiple: true
      - name: Merge and validate Karlstad structures
        env:
          KAU_SHARD_TOTAL: '8'
        run: |
          node scripts/kau-merge-shards.mjs
          node scripts/kau-finalize-overrides.mjs
          node scripts/kau-unresolved-report.mjs
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('data/kau/structure-meta.json','utf8'));
          const u=JSON.parse(fs.readFileSync('data/kau/unresolved.json','utf8'));
          if(m.processed!==134) throw new Error(`Expected 134, got ${m.processed}`);
          if(u.counts.totalKau!==134) throw new Error(`Unresolved audit expected 134, got ${u.counts.totalKau}`);
          if(u.counts.critical!==0||u.counts.metadataOnly!==0||u.counts.manualReview!==0) throw new Error(`Karlstad still has critical gaps: ${JSON.stringify(u.counts)}`);
          console.log(JSON.stringify(m,null,2));
          console.log(JSON.stringify(u.counts,null,2));
          NODE
      - name: Commit merged Karlstad structures
        run: |
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/kau/structure-meta.json data/kau/unresolved.json data/susa/structures.json
          git commit -m 'Finalize audited Karlstad structures [skip ci]' || exit 0
          git push origin HEAD:kau-sharded-import
