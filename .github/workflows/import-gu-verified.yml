# Continuation run 2026-09-30 after canonical dedupe/count sync
# Background schedule: daily plus manual trigger
name: Import GU verified structures
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [studielots-v2]
    paths:
      - 'scripts/import-gu-next-structures.mjs'
      - 'scripts/import-gu-name-only-plans.mjs'
      - 'scripts/materialize-gu-dietetics-2026.mjs'
      - 'scripts/materialize-gu-shrm-2026.mjs'
      - 'scripts/materialize-gu-geography-2026.mjs'
      - 'api/gu-program-structure.js'
      - 'scripts/audit-gu-coverage.mjs'
      - 'scripts/materialize-gu-verified-shards.mjs'
      - 'scripts/dedupe-gu-canonical-structures.mjs'
      - 'scripts/materialize-gu-finance-2027.mjs'
      - 'scripts/materialize-gu-international-business-2026.mjs'
      - 'scripts/materialize-gu-s1gls-2026.mjs'
      - 'scripts/materialize-gu-h1kap-2026.mjs'
      - 'scripts/materialize-gu-h1ppe-2026.mjs'
      - '.github/workflows/import-gu-verified.yml'
permissions:
  contents: write
concurrency:
  group: studielots-db-structure-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize verified GU structures in StudieLots DB
        run: node scripts/materialize-gu-verified-shards.mjs --write
      - name: Reconcile duplicate GU canonical plans
        run: node scripts/dedupe-gu-canonical-structures.mjs --write
      - name: Materialize source-backed GU finance 2027 plan
        run: node scripts/materialize-gu-finance-2027.mjs --write
      - name: Materialize source-backed GU international business 2026 plan
        run: node scripts/materialize-gu-international-business-2026.mjs --write
      - name: Materialize official GU Dietetics HT26 structure
        run: node scripts/materialize-gu-dietetics-2026.mjs --write
      - name: Materialize official GU Strategic HRM HT26 structure
        run: node scripts/materialize-gu-shrm-2026.mjs --write
      - name: Materialize official GU Geography HT26 structure
        run: node scripts/materialize-gu-geography-2026.mjs --write
      - name: Materialize official GU Global Studies HT26 structure
        run: node scripts/materialize-gu-s1gls-2026.mjs --write
      - name: Materialize official GU Cultural Heritage HT26 structure
        run: node scripts/materialize-gu-h1kap-2026.mjs --write
      - name: Materialize official GU Philosophy, Politics and Economics HT26 structure
        run: node scripts/materialize-gu-h1ppe-2026.mjs --write
      - name: Import verified GU structures
        env:
          GU_STRUCTURE_LIMIT: 20
          GU_STRUCTURE_OFFSET: 0
        run: node scripts/import-gu-next-structures.mjs --write
      - name: Import official GU overview plans without course codes
        run: node scripts/import-gu-name-only-plans.mjs --write
      - name: Audit GU coverage
        run: node scripts/audit-gu-coverage.mjs
      - name: Synchronize canonical manifest counters
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const manifestPath='data/studielots-db/programme-structures-manifest.json';
          const dbPath='data/studielots-db/manifest.json';
          const m=JSON.parse(fs.readFileSync(manifestPath));
          const rows=m.parts.flatMap(p=>{const x=JSON.parse(fs.readFileSync('data/studielots-db/'+p));return Array.isArray(x)?x:x.programs});
          const counts=new Map();
          for(const row of rows) counts.set(row.university,(counts.get(row.university)||0)+1);
          m.count=rows.length;
          m.universities=[...counts.entries()].map(([university,count])=>({university,count})).sort((a,b)=>b.count-a.count||a.university.localeCompare(b.university,'sv'));
          m.generatedAt=new Date().toISOString();
          fs.writeFileSync(manifestPath,JSON.stringify(m,null,2)+'\n');
          const db=JSON.parse(fs.readFileSync(dbPath));
          db.tables.programmeStructures.rows=rows.length;
          db.generatedAt=new Date().toISOString();
          fs.writeFileSync(dbPath,JSON.stringify(db,null,2)+'\n');
          console.log('Synchronized canonical programme structures: '+rows.length);
          NODE
      - name: Verify GU canonical structure counts and unique codes
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const db=JSON.parse(fs.readFileSync('data/studielots-db/manifest.json'));
          const m=JSON.parse(fs.readFileSync(db.tables.programmeStructures.storageManifest));
          const rows=m.parts.flatMap(p=>{const x=JSON.parse(fs.readFileSync('data/studielots-db/'+p));return Array.isArray(x)?x:x.programs});
          const gu=rows.filter(x=>x.university==='Göteborgs universitet');
          if(rows.length!==m.count||db.tables.programmeStructures.rows!==m.count)throw Error('Canonical structure count mismatch');
          if(gu.length!==m.universities.find(x=>x.university==='Göteborgs universitet').count)throw Error('GU count mismatch');
          if(new Set(gu.map(x=>x.programCode)).size!==gu.length)throw Error('Duplicate GU programme code');
          console.log('GU canonical structures: '+gu.length+', verified: '+gu.filter(x=>x.verified===true).length);
          NODE
      - name: Persist verified GU data
        run: |
          git config user.name 'studielots-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/studielots-db/programme-structures-ht26.json data/studielots-db/programme-structures-gu-next.json data/studielots-db/programme-structures-manifest.json data/studielots-db/manifest.json data/import-reviews/gu-coverage.json data/import-reviews/gu-structure-batch-latest.json data/import-reviews/gu-canonical-deduplication.json
          if [ -f data/studielots-db/programme-structures-gu-finance-2027.json ]; then git add -f data/studielots-db/programme-structures-gu-finance-2027.json; fi
          if [ -f data/studielots-db/programme-structures-gu-batch.json ]; then git add -f data/studielots-db/programme-structures-gu-batch.json; fi
          if git diff --cached --quiet; then echo 'No GU changes'; exit 0; fi
          git commit -m 'Import verified GU structures [skip ci]'
          git fetch origin studielots-v2
          git rebase origin/studielots-v2
          git push origin HEAD:studielots-v2
