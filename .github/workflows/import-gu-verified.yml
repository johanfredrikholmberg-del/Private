name: Import GU verified structures
on:
  workflow_dispatch:
  push:
    branches: [studielots-v2]
    paths:
      - 'scripts/import-gu-next-structures.mjs'
      - 'api/gu-program-structure.js'
      - 'scripts/audit-gu-coverage.mjs'
      - 'scripts/materialize-gu-verified-shards.mjs'
      - '.github/workflows/import-gu-verified.yml'
permissions:
  contents: write
concurrency:
  group: studielots-gu-verified
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize verified GU structures in StudieLots DB
        run: node scripts/materialize-gu-verified-shards.mjs --write
      - name: Import verified GU structures
        env:
          GU_STRUCTURE_LIMIT: 20
        run: node scripts/import-gu-next-structures.mjs --write
      - name: Audit GU coverage
        run: node scripts/audit-gu-coverage.mjs
      - name: Persist verified GU data
        run: |
          git config user.name 'studielots-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/studielots-db/programme-structures-ht26.json data/studielots-db/programme-structures-gu-next.json data/studielots-db/programme-structures-manifest.json data/studielots-db/manifest.json data/import-reviews/gu-coverage.json data/import-reviews/gu-structure-batch-latest.json
          if [ -f data/studielots-db/programme-structures-gu-batch.json ]; then git add -f data/studielots-db/programme-structures-gu-batch.json; fi
          if git diff --cached --quiet; then echo 'No GU changes'; exit 0; fi
          git commit -m 'Import verified GU structures [skip ci]'
          git fetch origin studielots-v2
          git rebase origin/studielots-v2
          git push origin HEAD:studielots-v2
