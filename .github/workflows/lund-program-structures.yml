name: Lund programme structures

on:
  workflow_dispatch:
  push:
    branches: [studielots-v2]
    paths:
      - 'scripts/import-lund-program-structures.mjs'
      - 'api/lu-program-structure.js'
      - '.github/workflows/lund-program-structures.yml'
      - 'data/HT26/programs.json'
      - 'data/program-db-lund.json'
      - 'data/program-db-lund-batch.json'
      - 'data/program-db-variants.json'
      - 'data/import-reviews/lund-program-structures-refresh.txt'

permissions:
  contents: write

concurrency:
  group: lund-program-structures
  cancel-in-progress: false

jobs:
  import:
    if: ${{ github.actor != 'studielots-bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Import verified Lund programme structures
        env:
          LUND_STRUCTURE_LIMIT: '300'
          LUND_STRUCTURE_CONCURRENCY: '6'
          LUND_STRUCTURE_TIMEOUT: '15000'
        run: node scripts/import-lund-program-structures.mjs
      - name: Validate canonical programme visibility
        run: node scripts/audit-ht26-search-readiness.mjs | tee lund-program-search-readiness.json
      - name: Commit Lund structure progress
        run: |
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/HT26/program-structures.json data/import-reviews/lund-program-structures-latest.json
          if git diff --cached --quiet; then
            echo 'No Lund structure changes.'
            exit 0
          fi
          git commit -m 'Materialise verified Lund programme structures [skip ci]'
          git fetch origin studielots-v2
          git rebase origin/studielots-v2
          git push origin HEAD:studielots-v2
      - name: Upload progress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lund-program-structure-progress
          path: |
            data/import-reviews/lund-program-structures-latest.json
            lund-program-search-readiness.json
