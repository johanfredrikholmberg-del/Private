# Manual background rerun 2026-09-29T06:40Z
name: Import Karlstad course details
# StudieLots batch trigger 2026-09-28 continue next next next
on:
  workflow_dispatch:
  push:
    branches: [studielots-v2]
    paths:
      - scripts/import-kau-course-details.mjs
      - scripts/materialize-kau-course-details.mjs
      - .github/workflows/kau-course-details-import.yml
  schedule:
    - cron: '37 4 * * *'
permissions:
  contents: write
concurrency:
  group: studielots-db-structure-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import official course details
        env:
          KAU_COURSE_LIMIT: '350'
        run: node scripts/import-kau-course-details.mjs
      - name: Materialize Karlstad details in StudieLots DB
        run: node scripts/materialize-kau-course-details.mjs --write
      - name: Validate imported course identities and provenance
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const courses=JSON.parse(fs.readFileSync('data/HT26/courses.json','utf8'));
          const details=JSON.parse(fs.readFileSync('data/HT26/course-details.json','utf8'));
          const report=JSON.parse(fs.readFileSync('data/import-reviews/kau-course-details-latest.json','utf8'));
          const db=JSON.parse(fs.readFileSync('data/studielots-db/manifest.json','utf8'));
          const canonicalDetails=JSON.parse(fs.readFileSync(db.tables.courseDetails.storage,'utf8'));
          const norm=x=>String(x??'').trim().toUpperCase();
          const canonical=new Map();
          for(const c of courses){if(c.university!=='Karlstads universitet')continue;const k=norm(c.code);canonical.set(k,(canonical.get(k)||0)+1)}
          const seen=new Set();
          for(const d of details){
            if(d.university!=='Karlstads universitet')continue;
            const k=norm(d.code);
            if(seen.has(k)||canonical.get(k)!==1||!d.name||!/^https:\/\/www\.kau\.se\//.test(d.sourceUrl||'')||d.sourceType!=='official-university-course-page')throw Error(`Invalid Karlstad course detail: ${k}`);
            seen.add(k);
          }
          if(report.total!==details.length||report.imported+report.previous!==report.total)throw Error('Course import report totals do not match data');
          if(db.database!=='StudieLots DB'||db.tables.courseDetails.rows!==seen.size||canonicalDetails.length!==seen.size)throw Error('StudieLots DB Karlstad details mismatch');
          console.log(`Validated ${seen.size} Karlstad course details; latest batch imported ${report.imported}`);
          NODE
      - name: Commit verified data and import report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/HT26/course-details.json data/import-reviews/kau-course-details-latest.json data/import-reviews/kau-course-details-unavailable.json data/studielots-db/course-details-kau.json data/studielots-db/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified Karlstad course details into HT26 [skip ci]'
            git fetch origin studielots-v2
            git rebase origin/studielots-v2
            git push origin HEAD:studielots-v2
          fi
