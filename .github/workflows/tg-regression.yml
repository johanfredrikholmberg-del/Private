name: TG regression
on:
  push:
    branches: [studielots-v2]
    paths:
      - 'src/engines/credit-transfer/**'
      - 'src/pages/planner/**'
      - 'scripts/test-credit-transfer.mjs'
      - '.github/workflows/tg-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tg-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run TG regression suite
        run: node scripts/test-credit-transfer.mjs