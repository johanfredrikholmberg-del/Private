name: Audit HT26 programme structures

on:
  workflow_dispatch:
  push:
    branches: [gu-program-import]
    paths:
      - '.github/workflows/ht26-structure-quality-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gu-program-import
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only programme structure audit
        run: node scripts/audit-ht26-program-structures.mjs > "$RUNNER_TEMP/ht26-structure-audit.json"
      - name: Publish audit summary
        run: |
          node - "$RUNNER_TEMP/ht26-structure-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const lines = [
            '# HT26 programme structure audit',
            '',
            `Programs: ${report.input.programs}; structures: ${report.input.structures}; courses: ${report.input.courses}`,
            `Findings: ${report.totalFindings}`,
            '',
            '| Category | Findings |',
            '| --- | ---: |',
            ...Object.entries(report.counts).map(([name, count]) => `| ${name} | ${count} |`),
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE
      - name: Upload full read-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: ht26-structure-quality-report
          path: ${{ runner.temp }}/ht26-structure-audit.json
          retention-days: 14
