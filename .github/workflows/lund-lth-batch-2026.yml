name: Lund LTH sequential browser evidence
on:
  push:
    branches: [gu-program-import]
    paths:
      - '.github/workflows/lund-lth-batch-2026.yml'
      - 'scripts/lund-lth-sequential-browser.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lund-lth-sequential-browser
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gu-program-import
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Extract one programme at a time with JavaScript enabled
        run: python scripts/lund-lth-sequential-browser.py
      - name: Validate and persist evidence only
        if: always()
        run: |
          if [ ! -f data/lund/lth-2026-sequential-browser-evidence.json ]; then exit 1; fi
          python - <<'PY'
          import json
          p=json.load(open('data/lund/lth-2026-sequential-browser-evidence.json'))
          assert p['canonicalDatabaseWritten'] is False and p['liveDatabaseWritten'] is False
          assert p['cohortVerified'] is False
          assert p['totalCourseRows'] == sum(x['courseRows'] for x in p['programmes'])
          assert len(p['programmes']) == 14
          print('Programmes:',len(p['programmes']),'rows:',p['totalCourseRows'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lund/lth-2026-sequential-browser-evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: preserve sequential LTH browser evidence [skip ci]'
          git pull --rebase origin gu-program-import
          git push origin HEAD:gu-program-import
