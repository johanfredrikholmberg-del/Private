name: Lund LTH 2026 batch evidence
on:
  push:
    branches: [gu-program-import]
    paths:
      - '.github/workflows/lund-lth-batch-2026.yml'
      - 'scripts/lund-lth-batch-2026.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lund-lth-batch-2026
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gu-program-import
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Extract and stage official LoT rows
        run: python scripts/lund-lth-batch-2026.py
      - name: Validate source and staging boundaries
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/lund/lth-2026-batch-evidence.json'))
          assert p['canonicalDatabaseWritten'] is False and p['liveDatabaseWritten'] is False
          assert p['cohortVerified'] is False and p['totalCourseRows'] > 0
          assert all(row['sourceUrl'].startswith('https://kurser.lth.se/lot/programme?') for x in p['programmes'] for s in x['sections'] for row in s['rows'])
          print('Validated',p['totalCourseRows'],'source rows in',p['programmesWithRows'],'programmes')
          PY
      - name: Persist evidence without promoting coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lund/lth-2026-batch-evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: stage LTH 2026/27 programme course evidence [skip ci]'
          git pull --rebase origin gu-program-import
          git push origin HEAD:gu-program-import
