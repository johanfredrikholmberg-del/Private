name: Official university data import (off Vercel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-programme-structures.yml'
  schedule:
    - cron: '47 3 * * 2,4,6'

permissions:
  contents: write

concurrency:
  group: official-programme-structures
  cancel-in-progress: false

jobs:
  import-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Read official sources directly from GitHub Actions, never the Vercel API.
      - name: Import Karlstad course catalogue from official sources
        env:
          KAU_COURSE_CONCURRENCY: '4'
        run: node scripts/kau-static-export.mjs
      # Do not overwrite previously verified programme structures: the current
      # Karlstad structure parser returned metadata-only for all 134 programmes.
      # Re-enable structure import only after its parser passes regression tests.
      - name: Validate imported catalogue locally without additional university requests
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const programmes = JSON.parse(fs.readFileSync('data/kau/programmes.json','utf8'));
          const courses = JSON.parse(fs.readFileSync('data/kau/courses.json','utf8'));
          const meta = JSON.parse(fs.readFileSync('data/kau/meta.json','utf8'));
          if (programmes.length !== 134 || meta.counts.programmes !== programmes.length) throw new Error('Karlstad programme catalogue incomplete');
          if (courses.length < 500 || meta.counts.susaCourseDefinitions !== courses.length) throw new Error('Karlstad course catalogue incomplete');
          if (new Set(programmes.map(p => p.code)).size !== programmes.length) throw new Error('Duplicate Karlstad programme codes');
          if (courses.some(c => !c.code || !c.name || c.university !== 'Karlstads universitet')) throw new Error('Invalid Karlstad course');
          if (courses.some(c => c.standalone === true && c.standaloneStatus !== 'verified-standalone-offering')) throw new Error('Unverified standalone course');
          console.log(`Validated ${programmes.length} programmes and ${courses.length} courses; existing programme structures preserved.`);
          NODE
      - name: Commit verified imports to existing database
        run: |
          if [ -z "$(git status --porcelain -- data/kau/programmes.json data/kau/courses.json data/kau/meta.json)" ]; then
            echo 'No database changes to commit.'
            exit 0
          fi
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/kau/programmes.json data/kau/courses.json data/kau/meta.json
          git commit -m 'Import verified Karlstad programme and course catalogue [skip ci]'
          git fetch origin studielots-v2
          git rebase origin/studielots-v2
          git push origin HEAD:studielots-v2
