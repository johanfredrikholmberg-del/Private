name: Official programme structures

on:
  workflow_dispatch:
  push:
    branches: [studielots-v2]
    paths:
      - 'scripts/official-programme-structure-pipeline.mjs'
      - 'scripts/hb-programme-structure-pipeline.mjs'
      - 'scripts/hb-verified-structure-overrides*.mjs'
      - 'scripts/hb-77-audit.mjs'
      - 'scripts/kau-catalogue-audit.mjs'
      - 'scripts/kau-static-export.mjs'
      - 'scripts/kau-programme-structure-pipeline.mjs'
      - '.github/workflows/official-programme-structures.yml'
  schedule:
    - cron: '47 3 * * 2,4,6'

permissions:
  contents: write

concurrency:
  group: official-programme-structures
  cancel-in-progress: false

jobs:
  enrich:
    if: ${{ github.actor != 'studielots-bot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enrich programme structures
        env:
          STRUCTURE_LIMIT: '500'
          STRUCTURE_CONCURRENCY: '10'
          HB_STRUCTURE_LIMIT: '100'
          HB_STRUCTURE_CONCURRENCY: '8'
          HB_INDEX_CONCURRENCY: '10'
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -Eq '^scripts/hb-(programme-structure-pipeline|verified-structure-overrides.*)\.mjs$'; then
            echo 'Borås code changed: running fast Borås-only enrichment.'
            node scripts/hb-programme-structure-pipeline.mjs
          else
            echo 'Running full official programme enrichment.'
            node scripts/official-programme-structure-pipeline.mjs
          fi
          node scripts/hb-verified-structure-overrides.mjs
          for n in $(seq 2 13); do
            node "scripts/hb-verified-structure-overrides-${n}.mjs"
          done
      - name: Build complete Karlstad catalogues
        env:
          KAU_COURSE_CONCURRENCY: '12'
        run: node scripts/kau-static-export.mjs
      - name: Enrich all Karlstad programme structures
        env:
          KAU_STRUCTURE_CONCURRENCY: '10'
        run: node scripts/kau-programme-structure-pipeline.mjs
      - name: Audit Borås 77-programme catalogue
        run: node scripts/hb-77-audit.mjs
      - name: Audit Karlstad programme catalogue
        run: node scripts/kau-catalogue-audit.mjs
      - name: Validate structure output
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('data/susa/structures.json','utf8'));
          const kauMeta=JSON.parse(fs.readFileSync('data/kau/meta.json','utf8'));
          const kauStructure=JSON.parse(fs.readFileSync('data/kau/structure-meta.json','utf8'));
          if (!rows.length) throw new Error('Structure output validation failed');
          const allowed=new Set(['complete','choice-required','partial-structure','manual-review','metadata-only']);
          if(rows.some(x=>!allowed.has(x.coverage))) throw new Error('Unknown coverage status');
          if(kauMeta.counts.programmes!==134) throw new Error('Karlstad programme catalogue is not complete');
          if(kauMeta.counts.susaCourseDefinitions<500) throw new Error('Karlstad course catalogue unexpectedly small');
          if(kauStructure.officialProgrammes!==134||kauStructure.processed!==134) throw new Error('Karlstad structure audit did not cover all programmes');
          console.log({kauMeta,kauStructure});
          NODE
      - name: Refresh global structure meta
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('data/susa/structures.json','utf8'));
          const counts=rows.reduce((a,x)=>(a[x.coverage||'metadata-only']=(a[x.coverage||'metadata-only']||0)+1,a),{});
          const retryable=rows.filter(x=>['metadata-only','manual-review'].includes(x.coverage)).length;
          const meta={generatedAt:new Date().toISOString(),processed:rows.length,remaining:0,retryable,counts};
          fs.writeFileSync('data/susa/structure-meta.json',JSON.stringify(meta,null,2)+'\n');
          NODE
      - name: Commit structure progress
        run: |
          if [ -z "$(git status --porcelain -- data/susa/structures.json data/susa/structure-meta.json data/kau)" ]; then exit 0; fi
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/susa/structures.json data/susa/structure-meta.json data/kau
          git commit -m 'Enrich Karlstad programme and course database [skip ci]'
          git fetch origin studielots-v2
          git rebase origin/studielots-v2
          git push origin HEAD:studielots-v2
