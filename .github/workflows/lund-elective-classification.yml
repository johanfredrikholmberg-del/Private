name: Lund elective classification
on:
  push:
    branches: [gu-program-import]
    paths: [.github/workflows/lund-elective-classification.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gu-program-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify course evidence with mixed requirements
        run: node scripts/lund-elective-classification.mjs
      - name: Validate conservative classification and EGEKO
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('data/lund/elective-classification.json'));
          const s=d.summary;
          if(s.programmes!==37||s.rows!==87||s.mandatory+s.elective+s.freeChoice+s.mixedMajorAndThesis+s.unclassified!==87)throw Error('Classification totals invalid');
          const e=d.results.find(p=>p.programCode==='EGEKO');
          if(!e||e.terms.find(t=>t.term===5)?.requiredElectiveHp!==30||e.terms.find(t=>t.term===6)?.mixedRequirementHp!==30||e.terms.find(t=>t.term===6)?.thesisHp!==15||e.terms.find(t=>t.term===4)?.majorChoiceOptions.length!==2)throw Error('EGEKO requirements invalid');
          if(d.results.some(p=>p.ht26Verified||p.coveragePromotionAllowed||p.terms.some(t=>t.termComplete)))throw Error('Unsafe promotion');
          console.log(s);
          NODE
      - name: Commit isolated classification
        run: |
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/lund/elective-classification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record corrected Lund elective classification [skip ci]'
          git fetch origin gu-program-import
          git rebase origin/gu-program-import
          git push origin HEAD:gu-program-import
