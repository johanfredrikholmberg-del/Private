name: Consolidate programme structures
on:
  workflow_dispatch:
  push:
    branches:
      - studielots-v2
    paths:
      - scripts/consolidate-programme-structures.mjs
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/consolidate-programme-structures.mjs
      - name: Commit canonical database
        run: |
          git config user.name "studielots-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/studielots-db/programme-structures-ht26.json data/studielots-db/programme-structures-manifest.json data/studielots-db/manifest.json
          git diff --cached --quiet || git commit -m "Consolidate programme structures into StudieLots DB"
          git push origin HEAD:studielots-v2
