name: KTH sequential HT26 study plans
on:
  push:
    branches: [program-import]
    paths:
      - '.github/workflows/kth-sequential-studyplans.yml'
      - 'scripts/kth-sequential-studyplans.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kth-sequential-studyplans
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: program-import
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Collect KTH programme course lists sequentially
        run: python scripts/kth-sequential-studyplans.py
      - name: Validate and persist evidence without database promotion
        if: always()
        run: |
          test -f data/kth/ht26-sequential-studyplan-evidence.json
          python - <<'PY'
          import json
          p=json.load(open('data/kth/ht26-sequential-studyplan-evidence.json'))
          assert p['canonicalDatabaseWritten'] is False and p['liveDatabaseWritten'] is False
          assert p['cohortVerified'] is False
          assert len(p['programmes']) == 4
          assert p['totalCourseRows'] == sum(x['courseRows'] for x in p['programmes'])
          print('KTH candidate course rows:',p['totalCourseRows'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kth/ht26-sequential-studyplan-evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: preserve KTH HT26 sequential evidence [skip ci]'
          git pull --rebase origin program-import
          git push origin HEAD:program-import
