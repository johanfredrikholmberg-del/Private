name: Lund official source audit
on:
  workflow_dispatch:
  push:
    branches: [gu-program-import]
    paths:
      - '.github/workflows/lund-source-audit.yml'
permissions:
  contents: write
concurrency:
  group: lund-source-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gu-program-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Lund official links without promoting unverified data
        run: node scripts/lund-source-audit.mjs
      - name: Validate source audit
        run: |
          node - <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('data/lund/source-audit.json'));if(a.unresolved!==118||a.checked>a.withOfficialLinks||a.results.length!==a.checked)throw Error('Invalid Lund source audit');console.log({unresolved:a.unresolved,withOfficialLinks:a.withOfficialLinks,checked:a.checked,officialAccessible:a.officialAccessible});
          NODE
      - name: Commit audit evidence only
        run: |
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/lund/source-audit.json
          git commit -m 'Record Lund official source audit [skip ci]'
          git fetch origin gu-program-import
          git rebase origin/gu-program-import
          git push origin HEAD:gu-program-import
