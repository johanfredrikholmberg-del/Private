name: Build KTH course catalogue
on:
  push:
    branches: [studielots-v2]
    paths:
      - '.github/workflows/build-kth-catalogue.yml'
      - 'scripts/import-kth-courses.mjs'
      - 'data/import-reviews/kth-catalogue-refresh.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect official KTH course API
        run: |
          node --input-type=module - <<'NODE'
          const url='https://api.kth.se/api/kopps/v2/courses/part?batch_size=2&index=1';
          try {
            const response=await fetch(url,{headers:{accept:'application/json'},signal:AbortSignal.timeout(15000)});
            const body=await response.text();
            let data;try{data=JSON.parse(body)}catch{}
            console.log(JSON.stringify({status:response.status,contentType:response.headers.get('content-type'),keys:data&&typeof data==='object'?Object.keys(data).slice(0,12):[],sample:JSON.stringify(data||body).slice(0,900)}));
          } catch(error) {console.log('KTH official API unavailable: '+String(error.message||error))}
          NODE
      - name: Import KTH course catalogue
        run: node scripts/import-kth-courses.mjs
      - name: Commit catalogue immediately
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/kth/courses.json ]; then
            echo "No KTH catalogue produced"
            exit 1
          fi
          git add -f data/kth/courses.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist KTH course catalogue [skip ci]"
          git fetch origin studielots-v2
          git rebase origin/studielots-v2
          git push origin HEAD:studielots-v2
