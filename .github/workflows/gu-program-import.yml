name: GU programme structure import

on:
  workflow_dispatch:
  push:
    branches: [gu-program-import]
    paths:
      - 'scripts/gu-programme-structure-pipeline.mjs'
      - '.github/workflows/gu-program-import.yml'

permissions:
  contents: write

concurrency:
  group: gu-program-structure-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gu-program-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import GU structures
        env:
          GU_CONCURRENCY: '6'
        run: node scripts/gu-programme-structure-pipeline.mjs
      - name: Validate GU output
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const meta=JSON.parse(fs.readFileSync('data/gu/meta.json','utf8'));
          if(meta.programmes<200) throw new Error('GU programme catalogue unexpectedly small');
          const resolved=(meta.counts.complete||0)+(meta.counts['choice-required']||0)+(meta.counts['partial-structure']||0);
          console.log({meta,resolved});
          NODE
      - name: Commit GU progress
        run: |
          if [ -z "$(git status --porcelain -- data/susa/structures.json data/gu)" ]; then exit 0; fi
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/susa/structures.json data/gu
          git commit -m 'Import GU programme structures [skip ci]'
          git fetch origin gu-program-import
          git rebase origin/gu-program-import
          git push origin HEAD:gu-program-import
