name: Import Lulea programme candidates
on:
  workflow_dispatch:
  push:
    branches: [studielots-v2]
    paths:
      - '.github/workflows/lulea-program-import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory Luleå candidates and canonical coverage
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const raw=read('data/susa/programmes.json');
          const rows=Array.isArray(raw)?raw:(raw.programmes||raw.items||raw.data||[]);
          const norm=v=>String(v??'').toLocaleLowerCase('sv-SE').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
          const candidates=rows.filter(x=>/lulea tekniska universitet/.test(norm(JSON.stringify(x))));
          const base='data/studielots-db/',m=read(base+'programme-structures-manifest.json');
          const structures=m.parts.flatMap(p=>{const x=read(base+p);return Array.isArray(x)?x:(x.programs||[])});
          const canonical=structures.filter(x=>/lulea tekniska universitet/.test(norm(x.university)));
          const report={generatedAt:new Date().toISOString(),university:'Luleå tekniska universitet',catalogueCandidates:candidates.length,canonicalStructures:canonical.length,verifiedCanonical:canonical.filter(x=>x.verified===true).length,status:'candidate-inventory',policy:'Only verified programme structures may be promoted to StudieLots DB.'};
          fs.mkdirSync('data/import-reviews',{recursive:true});
          fs.writeFileSync('data/import-reviews/lulea-import-latest.json',JSON.stringify(report,null,2)+'\n');
          fs.writeFileSync('data/import-reviews/lulea-programme-candidates.json',JSON.stringify(candidates,null,2)+'\n');
          console.log(report);
          NODE
      - name: Persist Luleå inventory
        run: |
          git config user.name 'studielots-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/import-reviews/lulea-import-latest.json data/import-reviews/lulea-programme-candidates.json
          git diff --cached --quiet || git commit -m 'Inventory Luleå programmes [skip ci]'
          git fetch origin studielots-v2
          git rebase origin/studielots-v2
          git push origin HEAD:studielots-v2
