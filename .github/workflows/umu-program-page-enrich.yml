name: Umea programme page enrich
on:
  push:
    branches: [umu-program-import]
    paths:
      - 'scripts/umu-program-page-enrich.mjs'
      - '.github/workflows/umu-program-page-enrich.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: umu-program-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enrich unresolved Umea programmes from official programme pages
        run: node scripts/umu-program-page-enrich.mjs
      - name: Validate output
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('data/umu/meta.json'));const s=JSON.parse(fs.readFileSync('data/umu/structures.json'));if(s.length!==m.programmes)process.exit(1);console.log(m.counts)"
      - name: Save Umea programme-page enrichment
        run: |
          git config user.name studielots-bot
          git config user.email actions@users.noreply.github.com
          git add -f data/umu
          git diff --cached --quiet || git commit -m 'Enrich Umea from official programme pages [skip ci]'
          git pull --rebase origin umu-program-import
          git push origin HEAD:umu-program-import
