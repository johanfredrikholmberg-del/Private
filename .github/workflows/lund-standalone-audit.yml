name: Lund standalone course audit
on:
  push:
    branches: [studielots-v2]
    paths:
      - 'data/lund-standalone-ht26-candidates.json'
      - 'scripts/lund-standalone-dedupe.mjs'
      - 'scripts/import-lund-standalone-offerings.mjs'
      - '.github/workflows/lund-standalone-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Lund candidates with canonical courses (read-only)
        shell: bash
        run: |
          set -o pipefail
          node scripts/lund-standalone-dedupe.mjs --input=data/lund-standalone-ht26-candidates.json --output=lund-review-candidates.json | tee lund-audit-report.txt
      - name: Import verified standalone offerings
        shell: bash
        run: node scripts/import-lund-standalone-offerings.mjs
      - name: Save audit result to review file on studielots-v2
        if: success() && github.ref == 'refs/heads/studielots-v2'
        shell: bash
        run: |
          set -euo pipefail
          test -s lund-review-candidates.json
          mkdir -p data/import-reviews
          cp lund-review-candidates.json data/import-reviews/lund-standalone-ht26.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/import-reviews/lund-standalone-ht26.json data/import-reviews/lund-standalone-offerings-latest.json data/HT26/course-offerings.json data/HT26/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Lund course audit for manual review [skip ci]'
            git push origin HEAD:studielots-v2
          fi
      - name: Show audit result in job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Lund: kontroll av kurskandidater'
            echo ''
            echo 'Detta är en läskontroll. Inga kurser eller kurstillfällen har importerats.'
            echo ''
            if [ -s lund-audit-report.txt ]; then
              echo '```text'
              cat lund-audit-report.txt
              echo '```'
            else
              echo 'Ingen granskningsrapport skapades. Kontrollera fel i körningen.'
            fi
            echo ''
            echo 'Granskningsfilen sparas även under data/import-reviews om körningen och skrivåtkomsten lyckas.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lund-standalone-audit
          path: |
            lund-audit-report.txt
            lund-review-candidates.json
          if-no-files-found: warn
