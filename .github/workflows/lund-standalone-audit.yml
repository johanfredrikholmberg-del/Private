name: Lund standalone course audit
on:
  push:
    branches: [studielots-v2]
    paths:
      - 'data/lund-standalone-ht26-candidates.json'
      - 'scripts/lund-standalone-dedupe.mjs'
      - '.github/workflows/lund-standalone-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Lund candidates with canonical courses (read-only)
        shell: bash
        run: |
          set -o pipefail
          node scripts/lund-standalone-dedupe.mjs --input=data/lund-standalone-ht26-candidates.json --output=lund-review-candidates.json | tee lund-audit-report.txt
      - name: Show audit result in job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Lund: kontroll av kurskandidater'
            echo ''
            echo 'Detta är en läskontroll. Inga kurser eller kurstillfällen har importerats.'
            echo ''
            if [ -s lund-audit-report.txt ]; then
              echo '```text'
              cat lund-audit-report.txt
              echo '```'
            else
              echo 'Ingen granskningsrapport skapades. Kontrollera fel i körningen.'
            fi
            echo ''
            echo 'Granskningsfilen finns även som artifact om kontrollen kunde skapa den.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lund-standalone-audit
          path: |
            lund-audit-report.txt
            lund-review-candidates.json
          if-no-files-found: warn
