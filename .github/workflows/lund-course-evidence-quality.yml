name: Lund course evidence quality
on:
  workflow_dispatch:
  push:
    branches: [gu-program-import]
    paths:
      - '.github/workflows/lund-course-evidence-quality.yml'
permissions:
  contents: write
concurrency:
  group: lund-course-evidence-quality
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gu-program-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit course rows and term totals
        run: node scripts/lund-course-evidence-quality.mjs
      - name: Validate read-only quality report
        run: |
          node - <<'NODE'
          const fs=require('fs');const q=JSON.parse(fs.readFileSync('data/lund/course-evidence-quality.json'));const e=JSON.parse(fs.readFileSync('data/lund/official-course-evidence.json'));if(q.checked!==e.checked||q.rows!==e.totalRows||q.verifiedForHT26!==0||q.results.some(x=>x.decision!=='manual-review-required'))throw Error('Invalid audit');console.log({checked:q.checked,rows:q.rows,termTotalsAt30:q.termTotalsAt30,verifiedForHT26:q.verifiedForHT26});
          NODE
      - name: Commit audit only
        run: |
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/lund/course-evidence-quality.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Lund course evidence quality [skip ci]'
          git fetch origin gu-program-import
          git rebase origin/gu-program-import
          git push origin HEAD:gu-program-import
