name: Lund SUSA small batch
on:
  push:
    branches: [studielots-v2]
    paths:
      - .github/workflows/lund-susa-small-batch.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lund-course-details-import
  cancel-in-progress: false
jobs:
  audit-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Import the next bounded Lund HT26 batch after successful verification
        env:
          LUND_COURSE_LIMIT: '10'
          LUND_COURSE_CODES: 'PFE11,PKU08,PKU09,PKU10,PST02,PST06,PUT01'
          LUND_BATCH_LABEL: 'ht26-official-course-packages'
        shell: bash
        run: |
          set -uo pipefail
          echo "Starting ${LUND_BATCH_LABEL}: next unresolved HT26 codes only"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/audit-lund-susa-coverage.mjs || exit $?
          if node scripts/import-lund-course-details.mjs; then
            import_status=0
          else
            import_status=$?
          fi
          node scripts/audit-lund-susa-coverage.mjs || exit $?
          git add -A -- data/HT26/course-details.json data/import-reviews/lund-susa-coverage.json data/import-reviews/lund-course-details-latest.json data/import-reviews/lund-course-details-unavailable.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save Lund syllabus import results and unavailable URLs [skip ci]' || exit $?
            git fetch origin studielots-v2 || exit $?
            git rebase origin/studielots-v2 || exit $?
            git push origin HEAD:studielots-v2 || exit $?
          fi
          node -e "const r=require('./data/import-reviews/lund-course-details-latest.json');const a=require('./data/import-reviews/lund-susa-coverage.json');console.log(JSON.stringify({batch:r,coverage:a.counts}))"
          exit "$import_status"
