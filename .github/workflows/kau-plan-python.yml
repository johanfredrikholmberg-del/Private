name: Karlstad portable education-plan pass
on:
  push:
    branches: [kau-fast-import]
    paths: ['.github/workflows/kau-plan-python.yml']
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kau-fast-import
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --quiet pypdf
      - name: Upgrade from KAU education plans
        run: python scripts/kau-education-plan-fallback.py
      - name: Validate dataset
        run: python -c "import json; r=json.load(open('data/kau/structures.json')); m=json.load(open('data/kau/structure-meta.json')); assert len(r)==134; print(m)"
      - name: Save upgrades
        run: |
          git config user.name studielots-bot
          git config user.email actions@users.noreply.github.com
          git add -f data/kau data/susa/structures.json
          git diff --cached --quiet || git commit -m 'Improve Karlstad from official education plans [skip ci]'
          git pull --rebase origin kau-fast-import
          git push origin HEAD:kau-fast-import
