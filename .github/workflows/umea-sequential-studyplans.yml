name: Umea sequential official study plans
on:
  push:
    branches: [program-import]
    paths:
      - '.github/workflows/umea-sequential-studyplans.yml'
      - 'scripts/umea-sequential-studyplans.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: umea-sequential-studyplans
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: program-import
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Collect programme study plans one by one
        run: python scripts/umea-sequential-studyplans.py
      - name: Validate and persist unverified evidence
        if: always()
        run: |
          test -f data/umea/ht26-sequential-studyplan-evidence.json
          python - <<'PY'
          import json
          p=json.load(open('data/umea/ht26-sequential-studyplan-evidence.json'))
          assert p['canonicalDatabaseWritten'] is False and p['liveDatabaseWritten'] is False
          assert p['cohortVerified'] is False
          assert len(p['programmes']) == 2
          assert p['totalCourseRows'] == sum(x['courseRows'] for x in p['programmes'])
          print('Umea evidence:',p['totalCourseRows'],'candidate course lines')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/umea/ht26-sequential-studyplan-evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: preserve Umea study-plan evidence [skip ci]'
          git pull --rebase origin program-import
          git push origin HEAD:program-import
