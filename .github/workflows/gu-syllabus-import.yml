name: GU syllabus version import

on:
  workflow_dispatch:
  push:
    branches: [gu-program-import]
    paths:
      - 'scripts/gu-syllabus-version-pipeline.mjs'
      - '.github/workflows/gu-syllabus-import.yml'

permissions:
  contents: write

concurrency:
  group: gu-syllabus-version-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gu-program-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import next GU syllabus batch into StudieLots HT26
        env:
          GU_SYLLABUS_CONCURRENCY: '5'
          GU_SYLLABUS_LIMIT: '250'
        run: node scripts/gu-syllabus-version-pipeline.mjs
      - name: Validate GU syllabus output
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const meta=JSON.parse(fs.readFileSync('data/gu/syllabus-meta.json','utf8'));
          const rows=JSON.parse(fs.readFileSync('data/HT26/syllabus-versions.json','utf8'));
          if(meta.database!=='StudieLots HT26') throw new Error('Wrong target database');
          if(!Array.isArray(rows)||rows.length===0) throw new Error('No syllabus versions written');
          console.log({meta,totalRows:rows.length});
          NODE
      - name: Commit GU syllabus progress
        run: |
          if [ -z "$(git status --porcelain -- data/HT26/syllabus-versions.json data/HT26/manifest.json data/gu/syllabus-meta.json)" ]; then exit 0; fi
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/HT26/syllabus-versions.json data/HT26/manifest.json data/gu/syllabus-meta.json
          git commit -m 'Import GU syllabus versions into StudieLots HT26 [skip ci]'
          git fetch origin gu-program-import
          git rebase origin/gu-program-import
          git push origin HEAD:gu-program-import

