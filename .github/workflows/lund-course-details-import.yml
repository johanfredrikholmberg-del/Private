name: Import Lund course details
on:
  workflow_dispatch:
  push:
    branches: [studielots-v2]
    paths:
      - scripts/import-lund-course-details.mjs
      - .github/workflows/lund-course-details-import.yml
permissions:
  contents: write
concurrency:
  group: lund-course-details-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Import Lund syllabuses in batches and save each completed batch
        env:
          LUND_COURSE_LIMIT: '100'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for batch in $(seq 1 25); do
            echo "Lund batch ${batch}"
            node scripts/import-lund-course-details.mjs
            git add -A -- data/HT26/course-details.json data/import-reviews/lund-course-details-latest.json
            if ! git diff --cached --quiet; then
              git commit -m "Import verified Lund syllabus details batch ${batch} [skip ci]"
              git fetch origin studielots-v2
              git rebase origin/studielots-v2
              git push origin HEAD:studielots-v2
            fi
            remaining=$(node -p "const r=require('./data/import-reviews/lund-course-details-latest.json'); Math.max(0,r.remainingBeforeBatch-r.attempted)")
            imported=$(node -p "require('./data/import-reviews/lund-course-details-latest.json').imported")
            echo "Remaining eligible candidates: ${remaining}; imported in batch: ${imported}"
            if [ "$remaining" -eq 0 ]; then
              echo 'All eligible canonical Lund course codes have been attempted; review errors and excluded identities separately.'
              break
            fi
            if [ "$imported" -eq 0 ]; then
              echo 'No progress: stopping to avoid retrying the same failing codes indefinitely.'
              exit 1
            fi
          done
