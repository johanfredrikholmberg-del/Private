name: Five universities sequential source evidence
on:
  push:
    branches: [program-import]
    paths:
      - '.github/workflows/five-universities-sequential-evidence.yml'
      - 'scripts/five-universities-sequential-evidence.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        institution: [linkoping, jonkoping, kalmar, malmo, handels-stockholm]
    concurrency:
      group: programme-evidence-${{ matrix.institution }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: program-import
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Collect one official programme source at a time
        env:
          INSTITUTION: ${{ matrix.institution }}
        run: python scripts/five-universities-sequential-evidence.py
      - name: Validate and persist source diagnostics only
        if: always()
        env:
          INSTITUTION: ${{ matrix.institution }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('data')/os.environ['INSTITUTION']/'ht26-sequential-source-evidence.json'
          assert p.exists(), 'Collector did not produce evidence'
          d=json.loads(p.read_text())
          assert d['institution']==os.environ['INSTITUTION']
          assert d['cohortVerified'] is False
          assert d['canonicalDatabaseWritten'] is False and d['liveDatabaseWritten'] is False
          assert d['totalCandidateLines']==sum(x['courseRows'] for x in d['programmes'])
          print('Saved diagnostics:',p)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "data/${INSTITUTION}/ht26-sequential-source-evidence.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: preserve ${INSTITUTION} source diagnostics [skip ci]"
          git pull --rebase origin program-import
          git push origin HEAD:program-import
