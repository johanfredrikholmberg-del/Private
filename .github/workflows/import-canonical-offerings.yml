name: Import canonical course offerings
on:
  workflow_dispatch:
  push:
    branches: [studielots-v2]
    paths:
      - 'scripts/import-canonical-offerings.mjs'
  schedule:
    - cron: '17 4 * * 1,3,5'
permissions:
  contents: write
concurrency:
  group: studielots-canonical-offerings
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import future standalone course offerings
        run: node scripts/import-canonical-offerings.mjs
      - name: Validate offerings
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const rows=JSON.parse(fs.readFileSync('data/HT26/course-offerings.json'));
          if(!rows.length) throw Error('No offerings imported');
          if(rows.some(x=>!x.key||!x.courseCode||!x.university||!x.startDate||!x.sourceUrl)) throw Error('Invalid offering');
          const dup=rows.length-new Set(rows.map(x=>x.key)).size;
          if(dup) throw Error('Duplicate offering keys: '+dup);
          const db=JSON.parse(fs.readFileSync('data/studielots-db/manifest.json'));
          if(db.tables.courseOfferings.rows!==rows.length) throw Error('StudieLots DB offering count mismatch');
          if(db.tables.courseOfferings.storage!=='data/HT26/course-offerings.json') throw Error('Unexpected StudieLots DB storage');
          console.log('Validated '+rows.length+' StudieLots DB offerings; GU '+rows.filter(x=>x.university==='Göteborgs universitet').length);
          NODE
      - name: Save canonical offerings
        run: |
          if [ -z "$(git status --porcelain -- data/offerings data/HT26/course-offerings.json data/studielots-db/manifest.json)" ]; then echo 'No offering changes'; exit 0; fi
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/offerings/meta.json data/HT26/course-offerings.json data/studielots-db/manifest.json
          git commit -m 'Import canonical course offerings [skip ci]'
          git fetch origin studielots-v2
          git rebase origin/studielots-v2
          git push origin HEAD:studielots-v2
