name: Import canonical course offerings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-canonical-offerings.yml']
  schedule:
    - cron: '17 4 * * 1,3,5'
permissions:
  contents: write
concurrency:
  group: studielots-canonical-offerings
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studielots-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import future standalone course offerings
        run: node scripts/import-canonical-offerings.mjs
      - name: Validate offerings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=JSON.parse(fs.readFileSync('data/offerings/canonical.json'));
          if(!rows.length) throw Error('No offerings imported');
          if(rows.some(x=>!x.offeringKey||!x.definitionKey||!x.code||!x.university||!x.startDate||!x.url)) throw Error('Invalid offering');
          if(new Set(rows.map(x=>x.offeringKey)).size!==rows.length) throw Error('Duplicate offering keys');
          console.log('Validated '+rows.length+' offerings; distance '+rows.filter(x=>x.distance).length);
          NODE
      - name: Save canonical offerings
        run: |
          if [ -z "$(git status --porcelain -- data/offerings)" ]; then echo 'No offering changes'; exit 0; fi
          git config user.name 'studielots-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f data/offerings/canonical.json data/offerings/meta.json
          git commit -m 'Import canonical course offerings [skip ci]'
          git fetch origin studielots-v2
          git rebase origin/studielots-v2
          git push origin HEAD:studielots-v2
