name: Umea latest plan pass
on:
  push:
    branches: [umu-program-import]
    paths:
      - 'scripts/umu-latest-plan-pass.mjs'
      - '.github/workflows/umu-latest-plan-pass.yml'
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: umu-program-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve latest Umea plan versions
        run: node scripts/umu-latest-plan-pass.mjs
      - name: Validate catalogue coverage
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('data/umu/meta.json'));if(m.latestPlanChecked!==161)process.exit(1);console.log(m)"
      - name: Save latest plan metadata
        run: |
          git config user.name studielots-bot
          git config user.email actions@users.noreply.github.com
          git add -f data/umu
          git diff --cached --quiet || git commit -m 'Resolve latest Umea education plans [skip ci]'
          git pull --rebase origin umu-program-import
          git push origin HEAD:umu-program-import
